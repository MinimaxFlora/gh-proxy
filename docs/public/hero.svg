<svg width="440" height="440" viewBox="0 0 440 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brand" x1="40" y1="40" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5" />
      <stop offset="0.5" stop-color="#06B6D4" />
      <stop offset="1" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="card" x1="90" y1="80" x2="350" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#EEF2FF" />
    </linearGradient>
    <linearGradient id="cloud" x1="130" y1="120" x2="310" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5" />
      <stop offset="1" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#4F46E5" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- 背景光斑 -->
  <circle cx="120" cy="120" r="96" fill="#6366F1" opacity="0.35" filter="url(#soft)" />
  <circle cx="330" cy="330" r="104" fill="#22D3EE" opacity="0.32" filter="url(#soft)" />

  <!-- 悬浮卡片 -->
  <g filter="url(#shadow)">
    <rect x="86" y="86" width="268" height="268" rx="34" fill="url(#card)" />
  </g>
  <rect x="86.5" y="86.5" width="267" height="267" rx="33.5" stroke="#C7D2FE" />
  <circle cx="118" cy="118" r="6" fill="#F87171" />
  <circle cx="138" cy="118" r="6" fill="#FBBF24" />
  <circle cx="158" cy="118" r="6" fill="#34D399" />

  <!-- 云朵 + 下载箭头 -->
  <path
    d="M150 214a46 46 0 0 1 44-52 50 50 0 0 1 92 16 40 40 0 0 1-6 80H176a34 34 0 0 1-26-44Z"
    fill="url(#cloud)"
    opacity="0.95"
  />
  <path d="m232 232-38 40h24v34h28v-34h24l-38-40Z" fill="#FFFFFF" />

  <!-- 进度条 -->
  <rect x="122" y="326" width="196" height="12" rx="6" fill="#E0E7FF" />
  <rect x="122" y="326" width="126" height="12" rx="6" fill="url(#brand)" />

  <!-- 速度线 -->
  <g stroke="url(#brand)" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <path d="M40 176h52" />
    <path d="M28 208h64" />
    <path d="M44 240h44" />
    <path d="M352 168h48" />
    <path d="M340 200h60" />
    <path d="M356 232h40" />
  </g>
</svg>
